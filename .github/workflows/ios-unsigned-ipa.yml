name: Build DukeX iOS (unsigned IPA)

# Manual-only. A commit, pull request, or branch update must never
# queue this workflow; run only after the owner explicitly approves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build forked native core and package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ runner.temp }}/dukex-vcpkg
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      SDK_NAME: iphoneos
    steps:
      - name: Checkout DukeX source
        uses: actions/checkout@v4

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install meson ninja pkgconf
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          meson --version
          ninja --version
          pkg-config --version

      - name: Bootstrap pinned vcpkg toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 9eec002df1cd109f8f104cd966a763daf9751489
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "XEMU_IOS_VCPKG_PREFIX=$VCPKG_ROOT/installed/arm64-ios" >> "$GITHUB_ENV"
          echo "MOLTENVK_ROOT=$VCPKG_ROOT/installed/arm64-ios" >> "$GITHUB_ENV"

      - name: Restore iOS dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/dukex-vcpkg/installed
            ${{ runner.temp }}/dukex-vcpkg/downloads
          key: ${{ runner.os }}-dukex-ios-vcpkg-2026.10.16-${{ hashFiles('ios/vcpkg.json', 'ios/vcpkg-triplets/**', 'ios/vcpkg-overlays/**') }}

      - name: Install pinned arm64 iOS native dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --triplet=arm64-ios \
            --overlay-triplets="$GITHUB_WORKSPACE/ios/vcpkg-triplets" \
            --overlay-ports="$GITHUB_WORKSPACE/ios/vcpkg-overlays" \
            --x-manifest-root="$GITHUB_WORKSPACE/ios" \
            --x-install-root="$VCPKG_ROOT/installed"

      # The upstream package is used only as a checksum-verified source of
      # the runtime MoltenVK.framework. The native xemu core and libslirp
      # are built from this fork below.
      - name: Obtain verified MoltenVK runtime framework
        shell: bash
        env:
          ORIGINAL_IPA: https://github.com/MaftyManicEMU/DukeX/releases/download/v1.0.2/DukeX.v1.0.2.ipa
          ORIGINAL_SHA256: 06565826bc2279e9201d6ffd883c9947e7df97c96a9421f9fba7748e6628d63b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dukex-upstream"
          curl --fail --location --retry 3 --retry-delay 3 \
            "$ORIGINAL_IPA" -o "$RUNNER_TEMP/dukex-upstream/release.ipa"
          echo "$ORIGINAL_SHA256  $RUNNER_TEMP/dukex-upstream/release.ipa" \
            | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/dukex-upstream/release.ipa" \
            -d "$RUNNER_TEMP/dukex-upstream/extracted"
          UPSTREAM_APP="$(find "$RUNNER_TEMP/dukex-upstream/extracted/Payload" \
            -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$UPSTREAM_APP" ]; then
            echo "::error::Official IPA does not contain Payload/*.app"
            exit 1
          fi
          MOLTENVK_FRAMEWORK="$UPSTREAM_APP/Frameworks/MoltenVK.framework"
          if [ ! -f "$MOLTENVK_FRAMEWORK/MoltenVK" ]; then
            echo "::error::Verified IPA does not contain MoltenVK.framework/MoltenVK"
            exit 1
          fi
          echo "MOLTENVK_FRAMEWORK=$MOLTENVK_FRAMEWORK" >> "$GITHUB_ENV"

      - name: Build forked native iOS core and libslirp
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MOLTENVK_ROOT/include/vulkan/vulkan.h"
          ios/scripts/build-core-ios.sh 2>&1 \
            | tee "$RUNNER_TEMP/dukex-core-build.log"

      - name: Verify forked native core ABI and architectures
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/build-ios-arm64/libxemu-ios-core.dylib"
          SLIRP="$GITHUB_WORKSPACE/build-ios-arm64/subprojects/slirp/libslirp.0.dylib"
          test -f "$CORE"
          test -f "$SLIRP"
          test -f "$MOLTENVK_FRAMEWORK/MoltenVK"
          xcrun lipo -verify_arch arm64 "$CORE"
          xcrun lipo -verify_arch arm64 "$SLIRP"
          xcrun lipo -verify_arch arm64 "$MOLTENVK_FRAMEWORK/MoltenVK"
          nm -gU "$CORE" | grep -E '[[:space:]]_xemu_ios_main$'
          nm -gU "$CORE" | grep -E '[[:space:]]_xemu_ios_set_touch_controller_state$'
          nm -gU "$CORE" | grep -E '[[:space:]]_xemu_ios_set_external_metal_layer$'
          nm -gU "$CORE" | grep -E '[[:space:]]_xemu_ios_set_gameplay_touch_event_callback$'
          echo "Verified fork-built arm64 core, Slirp, and required Swift bridge symbols."

      - name: Compile forked Swift app and embed fork-built runtime
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/DukeX/DukeX.xcodeproj \
            -scheme DukeX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dukex-derived-data" \
            PRODUCT_BUNDLE_IDENTIFIER=com.demonkingronin.dukex \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/dukex-xcodebuild.log"

      - name: Package unsigned native-core test IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dukex-derived-data/Build/Products/Release-iphoneos/DukeX.app"
          test -f "$APP/DukeX"
          test -f "$APP/Frameworks/libxemu-ios-core.dylib"
          test -f "$APP/Frameworks/libslirp.0.dylib"
          test -f "$APP/Frameworks/MoltenVK.framework/MoltenVK"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          if [ "$BUNDLE_ID" != "com.demonkingronin.dukex" ]; then
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dukex-package/Payload"
          /usr/bin/ditto "$APP" "$RUNNER_TEMP/dukex-package/Payload/DukeX.app"
          (
            cd "$RUNNER_TEMP/dukex-package"
            COPYFILE_DISABLE=1 zip -q -r -X \
              "$GITHUB_WORKSPACE/DukeX-NativeCore-unsigned.ipa" Payload
          )
          unzip -t "$GITHUB_WORKSPACE/DukeX-NativeCore-unsigned.ipa" | tail -n 1

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: DukeX-NativeCore-Unsigned-IPA
          path: DukeX-NativeCore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DukeX-native-core-build-logs
          path: |
            ${{ runner.temp }}/dukex-core-build.log
            ${{ runner.temp }}/dukex-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
